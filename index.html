<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Handwritten Text Recognition – Tamil & English</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>AI Handwritten Text Detection &amp; Recognition</h1>
  <p>Tamil &amp; English · image → editable digital text</p>
</header>
<main>
  <aside>
    <label class="btn">1 · Upload image<input type="file" id="file" accept="image/*" hidden></label>
    <label>Uncertain-word threshold: <b id="tv">70</b>%
      <input type="range" id="thr" min="30" max="95" value="70"></label>
    <button id="run" disabled>Run recognition</button>
    <progress id="bar" value="0" max="100"></progress>
    <ol id="steps"></ol>
    <div id="quality" class="note"></div>
  </aside>
  <section>
    <h2>Original ⇄ Processed image <small>(drag slider)</small></h2>
    <div class="cmp"><img id="orig" alt=""><canvas id="proc"></canvas></div>
    <input type="range" id="cut" min="0" max="100" value="50" class="full">
    <div id="langinfo" class="note"></div>
    <h2>Editable text <small>(<span class="lowkey">orange</span> = uncertain, <span class="fixkey">green</span> = auto-corrected)</small></h2>
    <div id="editor" contenteditable="true" spellcheck="false"></div>
    <div class="row">
      <button id="spell" disabled>AI spell correction (English)</button>
      <select id="tl"><option value="en">English</option><option value="ta">Tamil</option><option value="hi">Hindi</option><option value="te">Telugu</option><option value="ml">Malayalam</option><option value="kn">Kannada</option><option value="fr">French</option><option value="es">Spanish</option><option value="de">German</option></select>
      <button id="tr" disabled>Translate</button>
      <button id="txt" disabled>Export TXT</button>
      <button id="doc" disabled>Export Word</button>
      <button id="pdf" disabled>Export PDF</button>
    </div>
    <h2>Translated text <small id="trinfo"></small></h2>
    <div id="out" contenteditable="true" spellcheck="false"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
